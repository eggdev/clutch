[tools]
# The GitHub CLI. tools/github/pr.ts checks that this version runs.
gh = "2.103.3"
bun = "1.4.2"
node = "24.15.0"
# Secret scanning in pre-commit and CI. See .gitleaks.toml.
gitleaks = "8.30.1"
# Workflow lint in check-workflow-lint. actionlint runs shellcheck on each run:
# script, so a pinned shellcheck gives every machine the same result.
# See docs/contributing/setup/checks.md#ci.
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"
# The clutch CLI from the latest Clutch release. tools/clutch.ts runs it in a project.
# Clutch releases on each merge, so its own releases skip mise's 24-hour minimum age.
"github:eggdev/clutch" = { version = "latest", minimum_release_age = "0s" }
