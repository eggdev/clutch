name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. A job that needs more grants it in its own permissions block.
permissions:
  contents: read

env:
  # Agents run validate with CI=1 too, so Nx test hashes match.
  CI: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # check-migrations compares with the base commit, so it needs history.
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: bun run validate
        env:
          # A PR compares with its target branch. A push to main compares with
          # the commit before the push.
          MIGRATIONS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
