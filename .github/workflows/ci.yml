name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. A job that needs more grants it in its own permissions block.
permissions:
  contents: read

env:
  # Agents run validate with CI=1 too, so Nx test hashes match.
  CI: 1

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-migrations compares with the base commit, so it needs history.
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Check review-helper Python prerequisite
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ is required"'
      - run: bun install --frozen-lockfile
      # A PR checks only what it affects, against its target branch. A push to
      # main checks everything. validate --changed runs everything when the base
      # is all zeros. The job keeps the name validate, so the ruleset matches.
      - name: validate
        env:
          # A PR compares with its target branch. A push to main compares with
          # the commit before the push.
          CHECK_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bun run validate --changed
          else
            bun run validate
          fi
      # The quarantined tests in tools/flaky-tests.json run here on their own,
      # up to 3 times each. The step never fails the job, so a flaky test
      # cannot block a merge, and its result shows in the job summary.
      - name: quarantined tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun tools/run-quarantined.ts

  # Checks each commit subject of a PR against Conventional Commits. The
  # commit-msg hook checks them too, but --no-verify or another machine skips it.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: bun
      - name: Conventional commit subjects
        env:
          CHECK_BASE: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$CHECK_BASE..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            bun tools/hooks/commit-msg.ts "$RUNNER_TEMP/message" || { echo "::error title=Commit $sha::Reword it with git rebase."; status=1; }
          done
          exit "$status"

  # Scans the commits of the change for secrets. Pre-commit scans each commit
  # too, but a commit made with --no-verify or on another machine skips it.
  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: gitleaks
      - name: gitleaks
        env:
          CHECK_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # A new branch or a force push has no usable base, so scan the whole history.
          if git rev-parse --verify --quiet "$CHECK_BASE^{commit}" >/dev/null; then
            gitleaks git --redact --no-banner --log-opts="$CHECK_BASE..HEAD"
          else
            gitleaks git --redact --no-banner
          fi

  # Journeys drive the web app in a browser against the dev servers, so they
  # run in their own job and not in validate. Each web journey runs on a phone
  # (390 x 844), a tablet (820 x 1180) and a desktop (1440 x 900), on every PR.
  # See docs/contributing/end-to-end-testing.md#devices.
  journeys:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun install --frozen-lockfile
      # Chromium is about 150 MB, so the cache keeps it for each Playwright version.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install the Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      # Each test that needs a real Chromium: the page scripts of the journey kit, and each
      # local database of the object pool that the project has. Validate has no browser.
      - name: Run the browser tests
        run: git ls-files -- 'packages/*.browser.test.ts' | sed 's#^#./#' | xargs bun test
      - run: bun run journey --all
      - name: Keep the traces of a failed journey
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-traces
          path: test-results/journeys
          if-no-files-found: ignore
      # One JSON file for each journey: layout shift, clicks and keys, axe
      # results and timings on each device. See
      # docs/contributing/end-to-end-testing.md#measures.
      - name: Keep the measures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-measures-web
          path: test-results/journeys/measures
          if-no-files-found: ignore
          retention-days: 14
      # Each screenshot that `snap` took, at its baseline path. `bun run visual
      # pull <pr>` copies the changed ones into the baselines. See
      # docs/contributing/setup/verification.md#screenshots.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-screenshots
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 14

  # Which platforms the change reaches, by the reach rule in
  # tools/journeys/reach.ts. Native journeys run on a PR that touches a native
  # app, shared runtime code or a sensitive path, and on each push to main.
  # A platform's lane runs only when a native app declares its app ID. See
  # docs/contributing/end-to-end-testing.md#native-journeys.
  reach:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.reach.outputs.native }}
      ios: ${{ steps.reach.outputs.ios }}
      android: ${{ steps.reach.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun install --frozen-lockfile
      - name: Compute the reach
        id: reach
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bun tools/journeys/reach.ts --base "origin/$BASE_REF" --head "$HEAD_SHA"
          else
            bun tools/journeys/reach.ts --main
          fi

  # Each native journey on an iPhone 16 simulator. CI boots the device on its
  # own runner. The local device host finds it, and installs the build on it.
  native-ios:
    needs: reach
    if: needs.reach.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVICE_HOST: local
      # The default Xcode of the runner has Swift 6.1, and the native modules
      # of Expo 57 need Swift 6.2. The runner image also holds Xcode 26.3.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun install --frozen-lockfile
      - name: Install Maestro
        run: mise install maestro@cli-2.12.1
      - name: Boot the iPhone 16 simulator
        run: xcrun simctl boot "iPhone 16" && xcrun simctl bootstatus "iPhone 16"
      # macOS 15 does not resolve a name under `localhost`, and the simulator
      # uses the resolver of its host. The dev command prints each server name.
      - name: Make the dev server names resolve
        run: |
          names="$(mise exec -- bun run dev --check | sed -nE 's#.*https?://([^:/ ]+).*#\1#p' | sort -u | tr '\n' ' ')"
          echo "127.0.0.1 $names" | sudo tee -a /etc/hosts
      - name: Start the dev servers
        run: |
          mise exec -- bun run dev &
          dev=$!
          # The dev command gives each server its own time to answer, and stops
          # when one does not. So this step waits for the servers or for that stop.
          until mise exec -- bun run dev --check; do
            if ! kill -0 "$dev" 2>/dev/null; then
              echo "::error title=Dev servers did not start::bun run dev stopped before each server answered. Read its output above."
              exit 1
            fi
            sleep 2
          done
      # A debug build loads its JavaScript from the dev server, so the servers start first.
      - name: Build the app and install it on the simulator
        run: mise exec -- bun run native:build --platform ios --fresh
      - name: Run the native journeys
        run: mise exec maestro@cli-2.12.1 -- bun run journey --native ios
      - name: Keep the measures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-measures-ios
          path: test-results/journeys/measures
          if-no-files-found: ignore
          retention-days: 14

  # Each native journey on a Pixel 7 emulator with API 35. KVM makes the
  # emulator fast enough to run inside the time limit.
  native-android:
    needs: reach
    if: needs.reach.outputs.android == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      DEVICE_HOST: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun install --frozen-lockfile
      - name: Turn on KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: mise install maestro@cli-2.12.1
      - name: Run the native journeys on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          avd-name: pixel-7-api-35
          # Each project fills the build line at kickoff, so it builds the app
          # and installs it on the emulator. Until then a project with a native
          # app fails here, so no native lane passes with nothing tested.
          script: |
            echo "::error title=No native build::Fill the build line of the native-android job in .github/workflows/ci.yml. See docs/contributing/end-to-end-testing.md#native-journeys." && exit 1
            mise exec maestro@cli-2.12.1 -- bun run journey --native android
      - name: Keep the measures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-measures-android
          path: test-results/journeys/measures
          if-no-files-found: ignore
          retention-days: 14
