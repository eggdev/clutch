name: Grade verdicts

# The owner grades the auto-merge dry-run verdicts in the weekly calibration
# issue that gardening.yml opens. `agree with all` or `/agree all` adds a 👍 to
# each listed verdict, and `/disagree #<pr>` adds a 👎 to that PR's. Only the
# owner's comments count: automerge.owner in clutch.yaml, else the CODEOWNERS
# default. The reactions come from the release bot, so `clutch metrics` counts
# them as the owner's grades. tools/github/grade-verdicts.ts holds the rules. See
# .agents/skills/deliver/references/pull-requests.md#auto-merge.

on:
  # issue_comment runs with this repository's token. The grade job runs the
  # default branch's code, passes the comment body through a file, and mints
  # the bot token only after the owner check. No other trigger sees a comment.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

# Least privilege. The grade job grants what it needs in its own block.
permissions:
  contents: read

concurrency:
  group: grade-verdicts-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  grade:
    # A calibration issue, not a pull request, and a comment from a person.
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'automerge-calibration') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The default branch's code decides who the owner is, so no comment can change it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check that the owner commented
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: bun tools/github/grade-verdicts.ts check --author "$AUTHOR" >> "$GITHUB_OUTPUT"
      # The release bot reacts, so a grade is never a reaction from a person's token.
      # Without the app, the default token reacts as github-actions[bot].
      - name: Get the release bot token
        id: bot
        if: steps.owner.outputs.owner == 'true' && vars.CLUTCH_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLUTCH_APP_ID }}
          private-key: ${{ secrets.CLUTCH_APP_PRIVATE_KEY }}
          # Only the reactions, the reply and the issue body. The app has more permissions.
          permission-issues: write
          permission-pull-requests: write
      - name: Grade the listed verdicts
        if: steps.owner.outputs.owner == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/comment.md"
          bun tools/github/grade-verdicts.ts grade --issue "$ISSUE" --author "$AUTHOR" --body-file "$RUNNER_TEMP/comment.md"
