# Each PR needs a changeset (check-changeset), and the hosted Renovate app cannot
# write one. This job commits a patch changeset to each Renovate PR, so the
# update releases like any other change. It pushes with the release bot token,
# because a push with the default token starts no workflows. renovate.json lists
# the commit author in gitIgnoredAuthors, so Renovate keeps rebasing its branch,
# and this job adds the changeset again after each rebase. See
# docs/contributing/setup/dependencies.md#renovate.
name: Renovate changeset

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  changeset:
    if: >-
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLUTCH_APP_ID != ''
    runs-on: ubuntu-26.04
    steps:
      - name: Get the release bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLUTCH_APP_ID }}
          private-key: ${{ secrets.CLUTCH_APP_PRIVATE_KEY }}
          # Only the push to the Renovate branch.
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Commit a patch changeset
        env:
          BRANCH: ${{ github.head_ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          PUSH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          file=".changeset/renovate-${NUMBER}.md"
          if [ -f "$file" ]; then
            echo "::notice title=Changeset present::$file is on the branch."
            exit 0
          fi
          printf -- '---\n"%s": patch\n---\n\n%s\n' "$(jq -r .name package.json)" "$TITLE" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit --message 'chore(changeset): add a patch changeset for this PR'
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
