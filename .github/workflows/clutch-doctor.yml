# Runs clutch doctor --check, and sync --check in sync mode, for another
# repository. It uses the latest release of the Clutch repository that the
# caller's clutch.yaml names, so sync --check fails when the project is behind
# that release. A caller adds one job:
#
#   jobs:
#     clutch:
#       uses: eggdev/clutch/.github/workflows/clutch-doctor.yml@<sha> # main
#
# Pin a commit SHA from main. check-workflows rejects a branch or tag ref.
#
# When the caller is the Clutch repository itself, the job runs the CLI from the
# caller's own commit instead, so each Clutch PR tests this workflow.
#
# See apps/cli/README.md#use-clutch-in-another-repository.
name: Clutch doctor

on:
  workflow_call:
    inputs:
      root:
        description: The folder in the caller's repository that holds clutch.yaml.
        type: string
        default: .

# Read-only. The job checks out the caller and Clutch, and writes nothing.
permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the latest Clutch release
        id: clutch
        env:
          ROOT: ${{ inputs.root }}
        run: |
          config="$ROOT/clutch.yaml"
          if [ ! -f "$config" ]; then
            echo "::error title=No clutch.yaml::$config is missing. Run clutch init first."
            exit 1
          fi
          repo=$(yq -r '.template.repo' "$config")
          # Every merge to Clutch's main is a release tagged vX.Y.Z. The newest tag is the latest release.
          release=$(git ls-remote --tags --refs "https://github.com/$repo" 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$release" ]; then
            echo "::error title=No Clutch release::$repo has no vX.Y.Z release tag."
            exit 1
          fi
          self=false
          cli=.clutch-checkout
          if [ "$repo" = "$GITHUB_REPOSITORY" ]; then
            self=true
            cli=.
          fi
          {
            echo "repo=$repo"
            echo "release=$release"
            echo "mode=$(yq -r '.template.mode' "$config")"
            echo "self=$self"
            echo "cli=$cli"
          } >> "$GITHUB_OUTPUT"
      # Clutch lives under the workspace, because actions/checkout writes only there.
      # git ls-files skips it, so doctor never counts it as the caller's files.
      - if: steps.clutch.outputs.self != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.clutch.outputs.repo }}
          ref: ${{ steps.clutch.outputs.release }}
          path: .clutch-checkout
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          working_directory: ${{ steps.clutch.outputs.cli }}
      - name: Install Clutch
        working-directory: ${{ steps.clutch.outputs.cli }}
        run: bun install --frozen-lockfile
      - name: clutch doctor --check
        env:
          ROOT: ${{ inputs.root }}
          CLI: ${{ steps.clutch.outputs.cli }}
        run: bun "$CLI/apps/cli/src/main.ts" doctor --check --root "$ROOT"
      - name: clutch sync --check
        if: steps.clutch.outputs.mode == 'sync'
        env:
          ROOT: ${{ inputs.root }}
          RELEASE: ${{ steps.clutch.outputs.release }}
          CLI: ${{ steps.clutch.outputs.cli }}
        run: bun "$CLI/apps/cli/src/main.ts" sync --check --root "$ROOT" --to "$RELEASE"
