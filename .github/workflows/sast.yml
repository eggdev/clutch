# Static analysis (SAST) on each PR, on each push to main, and weekly, so a new
# rule finds old code too. One `sast` job picks the engine, scans and is the
# required check, so one ruleset fits every repository and a private
# repository pays for one runner. A pull request that changes only Markdown,
# images or the friction log skips the scan, since no scanned file changed. See https://github.com/eggdev/clutch/blob/main/docs/contributing/capabilities/codeql-sast.md.
#
# `sast` in clutch.yaml picks the engine: auto (the default), codeql or semgrep.
# Under auto, where GitHub code scanning takes results (a public repository, or
# one with GitHub Code Security), CodeQL runs and uploads to the Security tab. Default
# setup stays off in the repository settings, because GitHub refuses this
# workflow's upload while default setup is on. Elsewhere, the open-source
# Semgrep engine runs. CodeQL's license allows free use only on open-source
# code, so a private repository without Code Security never runs it.
name: SAST

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      engine:
        description: The engine to run. clutch.yaml runs the sast setting in clutch.yaml.
        type: choice
        options: [clutch.yaml, auto, codeql, semgrep]
        default: clutch.yaml

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main all finish.
concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The required check.
  sast:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      # Reads the code scanning alerts list, to see whether code scanning is
      # on, and uploads CodeQL results. Permissions are per job, so the
      # Semgrep path holds them too, unused.
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the engine
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          CHOICE: ${{ inputs.engine }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          # sast in clutch.yaml, unless a manual run picked an engine. Kickoff sets it.
          if [ -z "$CHOICE" ] || [ "$CHOICE" = clutch.yaml ]; then
            CHOICE=auto
            if [ -f clutch.yaml ]; then
              CHOICE="$(yq -r '.sast // "auto"' clutch.yaml)"
            fi
          fi
          # A schedule event carries no repository, so only a known public one
          # skips the probe. The alerts list answers 200, or 404 before the first
          # analysis, when code scanning is on. A 403 means a private repository
          # without Code Security.
          scanning=true
          if [ "$CHOICE" != semgrep ] && [ "$PRIVATE" != 'false' ] \
            && ! err="$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=1" 2>&1 >/dev/null)" \
            && printf '%s' "$err" | grep -q 'HTTP 403'; then
            scanning=false
          fi
          case "$CHOICE" in
            auto) if [ "$scanning" = true ]; then ENGINE=codeql; else ENGINE=semgrep; fi ;;
            codeql)
              if [ "$scanning" != true ]; then
                echo "::error title=CodeQL cannot run::sast is codeql, but this private repository has no GitHub Code Security, so code scanning takes no results. Turn on Code Security, or set sast to auto or semgrep in clutch.yaml. See https://github.com/eggdev/clutch/blob/main/docs/contributing/capabilities/codeql-sast.md."
                exit 1
              fi
              ENGINE=codeql
              ;;
            semgrep) ENGINE=semgrep ;;
            *)
              echo "::error title=Unknown SAST engine::sast is $CHOICE. Set it to auto, codeql or semgrep in clutch.yaml."
              exit 1
              ;;
          esac
          echo "::notice title=SAST engine::$ENGINE (sast: $CHOICE)"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
      # A pull request that changes only Markdown, images and the friction log
      # leaves every scanned file as the base has it, and the base was scanned
      # on its push. Changesets and tracker issues are Markdown too. GitHub lists at most 300 files,
      # so a longer list always scans.
      - name: Skip a docs-only pull request
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scan=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq '.files[].filename')"
            count="$(printf '%s\n' "$files" | grep -c . || true)"
            code="$(printf '%s\n' "$files" | grep -vE '\.(md|png|webp)$|^\.clutch/friction\.jsonl$' | grep -c . || true)"
            if [ "$count" -gt 0 ] && [ "$count" -lt 300 ] && [ "$code" = 0 ]; then
              scan=false
              echo "::notice title=SAST skipped::This pull request changes only Markdown, images or the friction log, so no scanned file changed."
            fi
          fi
          echo "scan=$scan" >> "$GITHUB_OUTPUT"
      # CodeQL reads each language here without a build, so one job runs all
      # three. actions covers the workflows. python covers tools/verification
      # and the skill scripts.
      - if: steps.pick.outputs.engine == 'codeql' && steps.scope.outputs.scan == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, actions, python
          build-mode: none
      # Local CI runs this job with act, on the owner's machine. GitHub has no
      # workflow run for it. CodeQL asks GitHub for that run to name its
      # analysis, and to upload, and both fail. So under local CI this step
      # names the analysis, as `<workflow file>:<job>`, and the scan uploads
      # nothing: it keeps its results in the job, where the step after it
      # reads them. On GitHub the results go to the Security tab, as before.
      - name: Name the analysis, under local CI
        if: env.ACT && steps.pick.outputs.engine == 'codeql' && steps.scope.outputs.scan == 'true'
        run: echo "CODEQL_ACTION_ANALYSIS_KEY=.github/workflows/sast.yml:sast" >> "$GITHUB_ENV"
      - if: steps.pick.outputs.engine == 'codeql' && steps.scope.outputs.scan == 'true'
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: ${{ env.ACT && 'never' || 'always' }}
      # Under local CI no code scanning judges the results, so this step does.
      # A finding is known when GitHub lists an alert of the same rule in the
      # same file that is not fixed: an open one, or one that a person
      # dismissed. Any other finding is new: it prints, and it fails the job.
      - name: Fail on a new CodeQL finding, under local CI
        if: env.ACT && steps.pick.outputs.engine == 'codeql' && steps.scope.outputs.scan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          ls "$SARIF_DIR"/*.sarif > /dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=100" \
            --jq '.[] | select(.state != "fixed") | "\(.rule.id)\t\(.most_recent_instance.location.path)"' \
            | sort -u > "$RUNNER_TEMP/known.tsv"
          jq -r '.runs[].results[]
            | select(((.suppressions // []) | length) == 0)
            | [.ruleId, .locations[0].physicalLocation.artifactLocation.uri,
               (.locations[0].physicalLocation.region.startLine | tostring),
               (.message.text | split("\n")[0])]
            | @tsv' "$SARIF_DIR"/*.sarif | sort -u > "$RUNNER_TEMP/found.tsv"
          new=0
          while IFS="$(printf '\t')" read -r rule file line message; do
            [ -n "$rule" ] || continue
            if grep -qxF "$(printf '%s\t%s' "$rule" "$file")" "$RUNNER_TEMP/known.tsv"; then
              continue
            fi
            new=$((new + 1))
            echo "::error file=$file,line=$line,title=$rule::$message"
          done < "$RUNNER_TEMP/found.tsv"
          echo "CodeQL found $(grep -c . "$RUNNER_TEMP/found.tsv" || true) result(s), and $new of them are new."
          if [ "$new" -gt 0 ]; then
            exit 1
          fi
      # A finding fails the job and prints in the log. A false positive gets
      # `nosemgrep: rule-id -- reason` on its line or the line above, and
      # check-suppressions rejects one without a reason. Each rule turned off
      # here is off everywhere, for this reason:
      # - detect-non-literal-regexp: the checks build regexes from the
      #   repository's own config, never from outside input.
      # - the minimum release age rules want 7 days. bunfig.toml and
      #   renovate.json wait 3 days, and dep_min_age checks that.
      # Semgrep Community Edition, the LGPL engine, pinned by digest. It needs
      # no account and no token, and uploads nothing.
      - name: Scan with Semgrep
        if: steps.pick.outputs.engine == 'semgrep' && steps.scope.outputs.scan == 'true'
        uses: docker://semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
        with:
          entrypoint: semgrep
          args: >-
            scan --config p/default --error --metrics off --disable-version-check
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
            --exclude-rule package_managers.bun.bun-missing-minimum-release-age.bun-missing-minimum-release-age
            --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
