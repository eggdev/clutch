name: Agent review

# An agent reviews each pull request against docs/contributing/review.md. The
# job fails when the agent returns a blocking finding. Whether that blocks a
# merge is a branch rule of each project. An owner finding, such as a weaker
# check, passes the job with an annotation, and auto-merge then leaves the PR
# for the owner. See docs/contributing/review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege. The review job grants what it needs in its own block.
permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base branch's clutch.yaml, so a pull request cannot change how it is judged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: |
            clutch.yaml
          sparse-checkout-cone-mode: false
      # GitHub gives no secrets to a fork PR, and a project may have none. The
      # review then passes with a notice, unless agentReview.missingCredential
      # in clutch.yaml is fail: a required agent-review check then proves that
      # a review ran.
      - name: Find the Anthropic credential
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            missing=notice
            if [ -f base/clutch.yaml ]; then
              missing="$(yq -r '.agentReview.missingCredential // "notice"' base/clutch.yaml)"
            fi
            if [ "$missing" = fail ]; then
              echo "::error title=Agent review did not run::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret reached this run, and agentReview.missingCredential in clutch.yaml is fail. A fork PR gets no secrets. See docs/contributing/review.md."
              exit 1
            fi
            echo "::notice title=Agent review off::Add the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret to turn on agent review. See docs/contributing/review.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credential.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The PR-head checkout above clears the workspace, so the base's agent instructions are checked out after it, into their own folder.
      - name: Check out the base branch's agent instructions
        if: steps.credential.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-instructions
          persist-credentials: false
          sparse-checkout: |
            CLAUDE.md
            AGENTS.md
            .claude/
          sparse-checkout-cone-mode: false
      # A PR cannot change the instructions or hooks of its own reviewer. Hooks and settings in .claude/ run inside the review job, so they also come from the base. The reviewer still sees the PR's changes to those files through gh pr diff.
      - name: Use the base branch's agent instructions
        if: steps.credential.outputs.present == 'true'
        run: |
          if [ ! -d .base-instructions ]; then
            echo "::error title=Base instructions missing::.base-instructions was not checked out, so the reviewer would run on the PR's own instructions. See docs/contributing/review.md."
            exit 1
          fi
          for file in CLAUDE.md AGENTS.md; do
            if [ -f ".base-instructions/$file" ]; then
              cp ".base-instructions/$file" "./$file"
            else
              rm -f "./$file"
            fi
          done
          rm -rf .claude
          if [ -d .base-instructions/.claude ]; then
            cp -R .base-instructions/.claude .claude
          fi
          rm -rf .base-instructions
      # gh pr diff and the files API stop at a size limit, so a large PR would be reviewed in slices. The checkout has the full history, so git writes the whole diff.
      - name: Write the full diff
        if: steps.credential.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --no-color "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr.diff"
          echo "Full diff: $(grep -c '^diff --git ' "$RUNNER_TEMP/pr.diff") files, $(wc -l < "$RUNNER_TEMP/pr.diff") lines."
      # Each head starts the review with no memory of the earlier heads, so their owner findings are listed here and the review checks them against the diff again.
      - name: Collect earlier owner findings
        if: steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The review's summary comment is newer than this, so the count step takes only summaries posted after it.
          echo "RUN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          out="$RUNNER_TEMP/prior-owner.md"
          if ! findings="$(gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | select(.commit_id != env.HEAD_SHA and .user.login == "github-actions[bot]") | select((.body | sub("^\\s+"; "") | split("\n")[0]) | test("^[^A-Za-z0-9]*owner([^A-Za-z0-9]|$)"; "i")) | "- \(.path):\(.line // .original_line // 0): \(.body | sub("^\\s+"; "") | split("\n")[0])"')"; then
            # Without the list, a finding could be dropped unseen, so the job fails and a re-run lists it again.
            echo "::error title=Earlier owner findings unknown::The review comments of earlier heads could not be listed, so an owner finding could be dropped unseen. Re-run the job."
            exit 1
          fi
          if [ -n "$findings" ]; then
            printf '%s\n' "$findings" > "$out"
          else
            echo "None." > "$out"
          fi
          echo "Earlier owner findings to recheck: $(grep -c '^- ' "$out" || true)"
      - name: Review the pull request
        id: review
        if: steps.credential.outputs.present == 'true'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own token, so the review needs no Claude GitHub App install.
          github_token: ${{ github.token }}
          # Review PRs that a bot opens too, such as gardening and dependency PRs.
          # A fork PR gets no secrets, so this reaches only bots inside the repository.
          allowed_bots: '*'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against docs/contributing/review.md.
            The PR branch is checked out in the current working directory.

            1. Read docs/contributing/review.md. Its rules are the only rules
               for this review. Do not add rules of your own.
            2. Read the full diff from the file at `${{ runner.temp }}/pr.diff`,
               and the description with `gh pr view`. Use `gh pr diff` only
               when the file is missing. The file can be longer than one Read,
               so page through it with offset until you reach the end. Open
               each file and doc page that you need.
            3. Read `${{ runner.temp }}/prior-owner.md`. For each earlier owner
               finding, check the current full diff. If the cause is still in
               the diff, raise the same `owner` finding again (inline and in the
               `owner` array). Drop it only when the diff no longer contains the
               cause, and then name it under "Resolved owner findings" in the
               summary, with the line of the diff that resolves it.
            4. For each finding, post one inline comment with
               `mcp__github_inline_comment__create_inline_comment` and
               `confirmed: true`. Start it with the level, `blocking`,
               `owner` or `note`, and name the rule from review.md.
            5. Post one summary comment with `gh pr comment`. Its first line
               must be exactly `## Agent review`, which the status command
               matches. List each finding with its level, or say that you
               found none.
            6. Return the number of blocking findings, one line for each
               `owner` finding, and a one-line summary.

            Report a problem only when the diff shows it. Do not post praise.
          # The cheapest model unless the CLUTCH_AGENT_MODEL repository variable names another one.
          claude_args: |
            --model ${{ vars.CLUTCH_AGENT_MODEL || 'claude-haiku-5-5' }}
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"integer","minimum":0},"owner":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}},"required":["blocking","owner","summary"]}'
      - name: Fail on a blocking finding
        id: findings
        if: steps.credential.outputs.present == 'true'
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error title=Agent review gave no result::The review step returned no structured output. Read the review step log."
            exit 1
          fi
          blocking="$(printf '%s' "$RESULT" | jq -r '.blocking')"
          summary="$(printf '%s' "$RESULT" | jq -r '.summary')"
          echo "$summary"
          # An owner finding passes the check, so the owner can still merge,
          # and leaves an annotation on this run. Auto-merge reads it from the
          # run and leaves the PR for the owner. The title must stay the same
          # as ownerAnnotation in tools/github/auto-merge.ts.
          printf '%s' "$RESULT" | jq -r '(.owner // [])[] | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | "::warning title=Owner review needed::" + .'
          if [ "$blocking" != 0 ]; then
            echo "::error title=Agent review found $blocking blocking problem(s)::$summary Fix each blocking comment on the PR, then push."
            exit 1
          fi
      # The structured answer can list fewer owner findings than the review posted as comments. Auto-merge reads only the annotations, so this step raises one for each inline owner comment when those are more. It never fails the job.
      - name: Count every owner finding
        if: always() && steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          owner_lines=()
          if ! comments="$(gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | select(.commit_id == env.HEAD_SHA and .user.login == "github-actions[bot]") | .body | sub("^\\s+"; "") | split("\n")[0] | select(test("^[^A-Za-z0-9]*owner([^A-Za-z0-9]|$)"; "i"))')"; then
            echo "::warning title=Owner count failed::The review comments could not be listed, so the inline owner count is unknown. The structured owner findings still feed auto-merge."
          else
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                owner_lines+=("$line")
              fi
            done <<< "$comments"
          fi
          owners=0
          if [ -n "$RESULT" ]; then
            owners="$(printf '%s' "$RESULT" | jq -r '(.owner // []) | length' 2>/dev/null || echo 0)"
          fi
          echo "Owner findings: ${owners} in the structured output, ${#owner_lines[@]} inline owner comment(s)."
          if [ "${#owner_lines[@]}" -gt "$owners" ]; then
            for line in "${owner_lines[@]}"; do
              line="${line//%/%25}"
              line="${line//$'\r'/%0D}"
              echo "::warning title=Owner review needed::$line"
            done
          fi
          # The earlier owner findings that Collect earlier owner findings listed. The summary of this run must name each one as resolved. Otherwise each one holds the PR again.
          prior=0
          if [ -f "$RUNNER_TEMP/prior-owner.md" ]; then
            prior="$(grep -c '^- ' "$RUNNER_TEMP/prior-owner.md" || true)"
          fi
          echo "Earlier owner findings: ${prior} from earlier heads."
          if [ "$prior" -gt 0 ]; then
            # Issue comments have no commit, so this run's summary is the newest one posted after RUN_START. Without a summary, every earlier finding is raised again.
            summary=""
            if [ -n "${RUN_START:-}" ]; then
              summary="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Agent review")) and .created_at >= env.RUN_START) | {created_at, body}' \
                | jq -rs 'sort_by(.created_at) | last | .body // empty')" || summary=""
            fi
            # The part of the summary from "Resolved owner findings" on must name each earlier finding by its path. A finding that it does not name is raised again, so a summary with no such section raises all of them.
            resolved="$(printf '%s\n' "$summary" | sed -n '/Resolved owner findings/I,$p')"
            raised=0
            while IFS= read -r line; do
              path="${line#- }"
              path="${path%%:*}"
              if printf '%s' "$resolved" | grep -qF "$path"; then
                continue
              fi
              raised=$((raised + 1))
              line="${line#- }"
              line="${line//%/%25}"
              line="${line//$'\r'/%0D}"
              echo "::warning title=Owner review needed::$line"
            done < <(grep '^- ' "$RUNNER_TEMP/prior-owner.md")
            echo "Earlier owner findings not named as resolved: ${raised}."
          fi
