name: Agent review

# An agent reviews each pull request against docs/contributing/review.md. The
# job fails when the agent returns a blocking finding. Whether that blocks a
# merge is a branch rule of each project. See docs/contributing/review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege. The review job grants what it needs in its own block.
permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # GitHub gives no secrets to a fork PR, and a project may have none. The
      # review then passes with a notice, so the job never fails for setup.
      - name: Find the Anthropic credential
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice title=Agent review off::Add the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret to turn on agent review. See docs/contributing/review.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credential.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Review the pull request
        id: review
        if: steps.credential.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own token, so the review needs no Claude GitHub App install.
          github_token: ${{ github.token }}
          # Review PRs that a bot opens too, such as gardening and dependency PRs.
          # A fork PR gets no secrets, so this reaches only bots inside the repository.
          allowed_bots: '*'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against docs/contributing/review.md.
            The PR branch is checked out in the current working directory.

            1. Read docs/contributing/review.md. Its rules are the only rules
               for this review. Do not add rules of your own.
            2. Read the diff with `gh pr diff` and the description with
               `gh pr view`. Open each file and doc page that you need.
            3. For each finding, post one inline comment with
               `mcp__github_inline_comment__create_inline_comment` and
               `confirmed: true`. Start it with the level, `blocking` or
               `note`, and name the rule from review.md.
            4. Post one summary comment with `gh pr comment`. List each
               finding with its level, or say that you found none.
            5. Return the number of blocking findings and a one-line summary.

            Report a problem only when the diff shows it. Do not post praise.
          # The cheapest model unless the CLUTCH_AGENT_MODEL repository variable names another one.
          claude_args: |
            --model ${{ vars.CLUTCH_AGENT_MODEL || 'claude-haiku-5-5' }}
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["blocking","summary"]}'
      - name: Fail on a blocking finding
        if: steps.credential.outputs.present == 'true'
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error title=Agent review gave no result::The review step returned no structured output. Read the review step log."
            exit 1
          fi
          blocking="$(printf '%s' "$RESULT" | jq -r '.blocking')"
          summary="$(printf '%s' "$RESULT" | jq -r '.summary')"
          echo "$summary"
          if [ "$blocking" != 0 ]; then
            echo "::error title=Agent review found $blocking blocking problem(s)::$summary Fix each blocking comment on the PR, then push."
            exit 1
          fi
