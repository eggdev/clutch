name: Auto-merge sweep

# Dispatches Auto-merge again for the green agent and bot PRs that have no
# verdict for their head, or whose last decide run failed, so a PR opened before
# a rules change still gets decided. It runs hourly, and on a push to main that
# changes an auto-merge rule. Up to 20 PRs a sweep. The choice is in
# tools/github/auto-merge-sweep.ts. A dispatch from GITHUB_TOKEN is the one event
# that such a token may start a workflow with, so only this job needs actions:
# write. See .agents/skills/deliver/references/pull-requests.md#auto-merge.

on:
  schedule:
    # Hourly, at an odd minute, away from the top of the hour.
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - tools/github/auto-merge*.ts
      - tools/github/bot-rule.ts
      - .github/workflows/auto-merge.yml
      - clutch.yaml

# Least privilege. The sweep job grants what it needs in its own block.
permissions:
  contents: read

concurrency:
  group: auto-merge-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # gh workflow run dispatches Auto-merge. gh run list reads its runs.
      actions: write
      # gh pr list, and the check runs and comments of each PR.
      pull-requests: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Dispatch the stale pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/github/auto-merge-sweep.ts
