name: Auto-merge

# Decides whether an agent or bot pull request may merge without a person, and
# acts on automerge in clutch.yaml. automerge.step sets the reach: bots, low or
# medium. on runs `gh pr merge --auto --merge` with the release bot token, so
# the release and CI run after the merge, and never while main is red. dry-run
# and on comment a verdict on each agent PR for the owner to grade.
# tools/github/auto-merge.ts holds the rules. See
# .agents/skills/deliver/references/pull-requests.md#auto-merge.
#
# A check suite that GitHub Actions creates starts no check_suite workflow, so
# this runs when CI or agent review completes. The run that sees every required
# check finished decides. It reads no label, because a label set with
# GITHUB_TOKEN starts no workflow. It runs the base branch's code, so a pull
# request cannot change the rules that judge it.
#
# The sweep (auto-merge-sweep.yml) dispatches this workflow. Hourly, it decides a
# green PR once on its final check state, and again only when its head changes
# or its last decide job fails. After a push that changes a rule, it decides
# every eligible PR again. A dispatch runs only from the default branch and
# judges the head the PR has then. The find job reads that head, and decide and
# merge queue on it, so a dispatch and an event run for the same head never
# decide at once. The scripts retry a gh read on a transient GitHub error, and
# never a write (tools/github/command.ts).

run-name: "Auto-merge${{ inputs.pr && format(' #{0}', inputs.pr) || '' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # workflow_run runs with this repository's token, so the decide job admits
  # only runs from branches of this repository, never a fork, and it runs the
  # default branch's code. No other trigger sees a completed Actions check.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Agent review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request number to judge again.
        required: true
        type: number

# Least privilege. Each job grants what it needs in its own block.
permissions:
  contents: read

jobs:
  find:
    # Every pull request from this repository, never a fork. The script judges
    # each one by its author and branch, so a person's PR gets only a refusal. A
    # push to main also completes CI, and is no pull request. A dispatch from
    # any branch but the default one is refused, and so is a fork's PR, which the
    # Find step refuses for a dispatch.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A dispatch judges the head that the PR has now. A fork's PR is
            # refused, as the workflow_run path refuses it: the decide job skips.
            pr_view="$(gh pr view "$PR" --json headRefOid,isCrossRepository --jq '.headRefOid + " " + (.isCrossRepository | tostring)')"
            read -r HEAD_SHA cross <<< "$pr_view"
            if [ "$cross" != false ]; then
              echo "::notice title=Auto-merge skipped::Pull request $PR comes from a fork, so it is not judged."
              PR=""
            fi
          elif [ -z "$PR" ]; then
            PR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')"
            if [ -z "$PR" ]; then
              echo "::notice title=Auto-merge skipped::No open pull request has head $HEAD_SHA."
            fi
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  decide:
    needs: find
    # Only when the find job found a PR that this run may judge.
    if: needs.find.outputs.number != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One decision at a time for each head commit, so two runs cannot both
    # comment. A dispatch and an event run on the same head queue here.
    concurrency:
      group: auto-merge-${{ needs.find.outputs.head }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      # The verdict comments.
      pull-requests: write
    # The merge job takes over when a PR may merge at the step.
    outputs:
      merge: ${{ steps.decide.outputs.merge }}
      step: ${{ steps.decide.outputs.step }}
      pr: ${{ needs.find.outputs.number }}
      head: ${{ needs.find.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.find.outputs.head }}
          # The risk diff needs the merge base, and the default branch runs the rules.
          fetch-depth: 0
      - name: Check out the default branch
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git checkout --quiet --detach "origin/$DEFAULT_BRANCH"
          if [ -f .clutch/risk.yaml ] && [ -f tools/github/auto-merge.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Auto-merge off::The default branch has no .clutch/risk.yaml or tools/github/auto-merge.ts yet, so nothing is judged."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.present == 'true'
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - if: steps.base.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - name: Decide
        id: decide
        if: steps.base.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Write merge=true and the step for the merge job, never merge here.
          AUTOMERGE_HANDOFF: '1'
          PR: ${{ needs.find.outputs.number }}
          HEAD_SHA: ${{ needs.find.outputs.head }}
        run: |
          set -o pipefail
          bun tools/github/auto-merge.ts --pr "$PR" --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  # Enables GitHub's auto-merge, `gh pr merge --auto --merge`, with the release
  # bot's token. A merge made with the default token starts no workflow, so the
  # release and CI on main would not run after it. The bot's key lives in the
  # release environment, which only the default branch may use, so only a
  # workflow_run run or a dispatch from the default branch merges. A
  # pull_request run waits for the next one.
  merge:
    needs: decide
    if: >-
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') &&
      needs.decide.outputs.merge == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: auto-merge-${{ needs.decide.outputs.head }}
      cancel-in-progress: false
    environment: release
    permissions:
      # gh pr merge --auto needs contents: write. The comment needs pull-requests: write.
      contents: write
      pull-requests: write
    steps:
      - name: Get the release bot token
        id: bot
        if: vars.CLUTCH_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLUTCH_APP_ID }}
          private-key: ${{ secrets.CLUTCH_APP_PRIVATE_KEY }}
          # Only the merge and its comment. The app has more permissions.
          permission-contents: write
          permission-pull-requests: write
      - name: Warn without the release bot
        if: vars.CLUTCH_APP_ID == ''
        run: echo "::warning title=No release bot::The default token enables the merge, so the release and CI on main do not run after it. See docs/contributing/setup/releases.md#the-release-bot."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # Without scripts, so the repository's git hooks stay off.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Enable auto-merge for the judged head
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          HEAD_SHA: ${{ needs.decide.outputs.head }}
          STEP: ${{ needs.decide.outputs.step }}
        run: bun tools/github/auto-merge.ts --enable --pr "$PR" --head "$HEAD_SHA" --step "$STEP"
