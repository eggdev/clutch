name: Auto-merge

# Decides whether an agent or bot pull request may merge without a person, and
# acts on automerge in clutch.yaml. automerge.step sets the reach: bots, low or
# medium. on runs `gh pr merge --auto --merge` with the release bot token, so
# the release and CI run after the merge, and never while main is red. dry-run
# and on comment a verdict on each agent PR, which the owner grades with a
# reaction.
# tools/github/auto-merge.ts holds the rules. See
# .agents/skills/deliver/references/pull-requests.md#auto-merge.
#
# Three things start it, and no schedule does:
#
# - `bun run pr merge <number>`, in the session that built the PR, dispatches
#   it once the PR is ready, then waits for the merge, the release and CI on
#   main.
# - The owner's approval of a head. The session may have ended by then, so the
#   approval hands the PR to a dispatch from the default branch.
# - A completed CI or Agent review run on a PR that no session owns: a
#   `revert/` PR that the Auto-revert net opened, or a bot's `renovate/`,
#   `gardening/` or `clutch-sync/` PR. An agent's `clutch/` PR never merges
#   from this event, so it merges only when its session asks.
#
# Each run uses the default branch's code, so a pull request cannot change the
# rules that judge it. The decide job judges the head that the PR has then, and
# the merge job pins the merge to that head. The scripts retry a gh read on a
# transient GitHub error, and never a write (tools/github/command.ts).

run-name: "Auto-merge${{ inputs.pr && format(' #{0}', inputs.pr) || '' }}"

on:
  pull_request_review:
    types: [submitted]
  # workflow_run runs with this repository's token, so the decide job admits
  # only runs from branches of this repository, never a fork, and it runs the
  # default branch's code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Agent review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request number to judge.
        required: true
        type: number

# Least privilege. Each job grants what it needs in its own block.
permissions:
  contents: read

jobs:
  decide:
    # The script judges each PR by its author and branch, so a person's PR gets
    # only a refusal. The Find step refuses a fork's PR on a dispatch.
    if: >-
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'revert/') ||
      startsWith(github.event.workflow_run.head_branch, 'renovate/') ||
      startsWith(github.event.workflow_run.head_branch, 'gardening/') ||
      startsWith(github.event.workflow_run.head_branch, 'clutch-sync/'))) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One decision at a time for each pull request, so two runs cannot both
    # comment. A workflow_run that names no PR falls back to its head commit.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      # The verdict comments.
      pull-requests: write
      # An approval's run hands its merge to a run from the default branch.
      actions: write
    # The merge job takes over when a PR may merge at the step.
    outputs:
      merge: ${{ steps.decide.outputs.merge }}
      step: ${{ steps.decide.outputs.step }}
      pr: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
    steps:
      - name: Find the pull request
        id: pr
        # The limit that the find job had.
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          # This step runs before the checkout, so gh needs the repository named.
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A dispatch judges the head that the PR has now. A fork's PR is
            # refused: the run judges nothing.
            pr_view="$(gh pr view "$PR" --json headRefOid,isCrossRepository --jq '.headRefOid + " " + (.isCrossRepository | tostring)')"
            read -r HEAD_SHA cross <<< "$pr_view"
            if [ "$cross" != false ]; then
              echo "::notice title=Auto-merge skipped::Pull request $PR comes from a fork, so it is not judged."
              PR=""
            fi
          elif [ -z "$PR" ]; then
            PR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')"
            if [ -z "$PR" ]; then
              echo "::notice title=Auto-merge skipped::No open pull request has head $HEAD_SHA."
            fi
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # Only when this run found a PR that it may judge.
      - if: steps.pr.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.pr.outputs.head }}
          # The risk diff needs the merge base, and the default branch runs the rules.
          fetch-depth: 0
      - name: Check out the default branch
        id: base
        if: steps.pr.outputs.number != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git checkout --quiet --detach "origin/$DEFAULT_BRANCH"
          if [ -f .clutch/risk.yaml ] && [ -f tools/github/auto-merge.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Auto-merge off::The default branch has no .clutch/risk.yaml or tools/github/auto-merge.ts yet, so nothing is judged."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.present == 'true'
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - if: steps.base.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - name: Decide
        id: decide
        if: steps.base.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Write merge=true and the step for the merge job, never merge here.
          AUTOMERGE_HANDOFF: '1'
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -o pipefail
          bun tools/github/auto-merge.ts --pr "$PR" --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      # An approval's run belongs to the PR, so the merge job, which needs the
      # release environment of the default branch, cannot run in it. A
      # dispatch from the default branch decides again and merges.
      - name: Hand an approved merge to the default branch
        if: github.event_name == 'pull_request_review' && steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run auto-merge.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f pr="$PR"

  # Enables GitHub's auto-merge, `gh pr merge --auto --merge`, with the release
  # bot's token. A merge made with the default token starts no workflow, so the
  # release and CI on main would not run after it. The bot's key lives in the
  # release environment, which only the default branch may use.
  merge:
    needs: decide
    # The release environment takes only the default branch: a workflow_run or a
    # dispatch. An approval's run handed its merge to a dispatch above.
    if: >-
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') &&
      needs.decide.outputs.merge == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: auto-merge-${{ needs.decide.outputs.head }}
      cancel-in-progress: false
    environment: release
    permissions:
      # gh pr merge --auto needs contents: write. The comment needs pull-requests: write.
      contents: write
      pull-requests: write
    steps:
      - name: Get the release bot token
        id: bot
        if: vars.CLUTCH_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLUTCH_APP_ID }}
          private-key: ${{ secrets.CLUTCH_APP_PRIVATE_KEY }}
          # Only the merge and its comment. The app has more permissions.
          permission-contents: write
          permission-pull-requests: write
      - name: Warn without the release bot
        if: vars.CLUTCH_APP_ID == ''
        run: echo "::warning title=No release bot::The default token enables the merge, so the release and CI on main do not run after it. See docs/contributing/setup/releases.md#the-release-bot."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # Without scripts, so the repository's git hooks stay off.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Enable auto-merge for the judged head
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          PR: ${{ needs.decide.outputs.pr }}
          HEAD_SHA: ${{ needs.decide.outputs.head }}
          STEP: ${{ needs.decide.outputs.step }}
        run: bun tools/github/auto-merge.ts --enable --pr "$PR" --head "$HEAD_SHA" --step "$STEP"
