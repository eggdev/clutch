# Self-hosted Renovate. It runs the open-source Renovate CLI each day against
# this repository, with renovate.json as its config. It signs in as the release
# bot, so its PRs start CI and agent review, which a PR from the default token
# would not. Without the release bot, the job skips with a notice. See
# docs/contributing/setup/dependencies.md#renovate.
name: Renovate

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A queued run picks up where the last one stopped.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Renovate uses the release bot token, not this one.
    permissions:
      contents: read
    steps:
      - name: Find the release bot
        id: app
        env:
          APP_ID: ${{ vars.CLUTCH_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::notice title=Renovate off::Set up the release bot (CLUTCH_APP_ID and CLUTCH_APP_PRIVATE_KEY) to turn on Renovate. See docs/contributing/setup/releases.md#the-release-bot."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Get the release bot token
        id: bot
        if: steps.app.outputs.present == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLUTCH_APP_ID }}
          private-key: ${{ secrets.CLUTCH_APP_PRIVATE_KEY }}
          # Branches and pull requests. Workflows write lets Renovate update
          # action pins; renovate.json keeps that manager off until the app has it.
          permission-contents: write
          permission-pull-requests: write
      # Renovate commits as the bot, so the commits job and CODEOWNERS see one author.
      - name: Find the bot's commit author
        id: author
        if: steps.app.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          id="$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)"
          echo "git=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.present == 'true'
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.bot.outputs.token }}
          # Older than 3 days, like every other dependency.
          renovate-version: 44.186.4
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: ${{ steps.author.outputs.git }}
          # Only the changeset task in renovate.json may run.
          RENOVATE_ALLOWED_COMMANDS: '["^node tools/release/renovate-changeset\\.mjs$"]'
