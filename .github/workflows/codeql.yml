# CodeQL static analysis on each PR, on each push to main, and weekly, so a new
# query finds old code too. Results go to the repository's code scanning alerts.
# Default setup stays off in the repository settings, because GitHub refuses
# this workflow's upload while default setup is on. See
# docs/contributing/capabilities/codeql-sast.md.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main all finish.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # actions covers the workflows. python covers tools/verification and the skill scripts.
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # Each language here is interpreted, so CodeQL reads the source without a build.
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
