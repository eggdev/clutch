# How this repository adopts Clutch. See apps/cli/README.md#clutchyaml.
schemaVersion: 1
project: clutch
template:
  repo: eggdev/clutch
  # The template is the source of Clutch, so doctor checks it and sync never runs on it.
  mode: doctor
# Each capability the template has is adopted. Each gap is waived until the issue
# that adopts it is done. clutch doctor --check enforces both.
capabilities:
  root_agents_md: adopted
  nested_agent_rules: adopted
  skills_dir: adopted
  factory_as_code: adopted
  friction_log: adopted
  codeowners: adopted
  pr_template: adopted
  git_hooks: adopted
  canonical_check: adopted
  dev_bootstrap: adopted
  project_cli: adopted
  verification_cli: adopted
  custom_lint_plugin: adopted
  suppression_discipline: adopted
  ratchets: adopted
  file_size_caps: adopted
  changed_scope_check: adopted
  protected_main: adopted
  secret_scanning: adopted
  codeql_sast: adopted
  dep_automation: adopted
  dep_min_age: adopted
  ci_security_lint: adopted
  oidc_ci:
    {
      status: waived,
      reason: 'CI deploys to no cloud provider. The Claude plan token has no OIDC exchange, and the release bot needs its GitHub App key. See docs/contributing/setup/ci-credentials.md.',
    }
  security_agent_loop: adopted
  worktree_parallel: adopted
  cloud_agent_vm: adopted
  mcp_config: adopted
  ai_review_bot: adopted
  ai_review_blocking: adopted
  ci_failure_explainer: adopted
  flaky_quarantine: adopted
  a11y_checks: adopted
  flake_hunter: adopted
  pr_size_limits: adopted
  merge_queue: { status: waived, reason: Waits for its trigger in CL-906., issue: CL-906 }
  risk_tier_automerge: adopted
  gardener_bots: adopted
  factory_observability: adopted
# What the Auto-merge workflow does: off, dry-run or on. on queues GitHub's
# auto-merge, with the release bot, for each PR in reach at the step, and never
# while main is red. The step is how far it reaches: bots, then low, then
# medium. Brendan approved the steps on 2026-10-30, the step low on
# 2026-11-01, and the step medium on 2026-11-02, with the target of 80% of PRs
# merging with no human. See
# docs/contributing/decisions/0002-merge-most-prs-with-no-human.md and
# .agents/skills/deliver/references/pull-requests.md#auto-merge.
automerge:
  mode: on
  # Bot PRs that pass the bot rule, and agent PRs whose risk tier is low or
  # medium: all but the one-way-door hard core in .clutch/risk.yaml.
  step: medium
  # The owner's approval of a head lets a PR that waits for them merge. See
  # .agents/skills/deliver/references/pull-requests.md#approval.
  owner: eggdev
# The static analysis engine that .github/workflows/sast.yml runs. auto runs CodeQL where
# code scanning takes results and Semgrep elsewhere. This repository is public, so auto runs
# CodeQL. Kickoff asks each project. See docs/contributing/capabilities/codeql-sast.md.
sast: auto
# When clutch labels warns about a large PR. Size never fails one (CL-401).
pr_size:
  warn: 300
  exclude: []
# clutch worktree new --check runs check in the new checkout after the setup.
worktree:
  root: ../clutch.worktrees
  copy: [.env.local]
  setup: ['mise trust --quiet', 'mise exec -- bun install']
  check: mise exec -- bun run validate
# The repositories that .github/workflows/weekly-digest.yml reads each Monday. The release
# bot reads each one, so it must be installed on it. See
# docs/contributing/capabilities/factory-observability.md#weekly-digest.
fleet:
  - repo: eggdev/clutch
    ref: main
  - repo: eggdev/neighborhood
    ref: main
  # epic/refactor until CL-705 moves Bar Savvy to main.
  - repo: blockmen-group/bar-savvy-web
    ref: epic/refactor
# The work that is ready for the factory. C-Suite's GitHub intake starts a lane for an
# issue with a label in github. tracker names the .clutch/issues states that are ready,
# for an issue with owner: agent outside later. clutch issues next reads it.
# .clutch/README.md#ready-for-the-factory names the same values, and
# clutch factory --check fails when the two disagree.
factory:
  intake:
    github: [factory]
    linear: []
    tracker: [todo]
