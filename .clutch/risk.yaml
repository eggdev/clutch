# Risk tiers by path. `clutch risk` gives each changed file the highest tier
# whose globs match it, and a change the highest tier of its files. A file that
# no rule matches gets `unmatched`. A file that matches a rule's `except`
# does not match that rule. A rule with `lines` matches a file only when one of
# its added or removed lines matches. Auto-merge reads the tier, so this file
# is part of the merge gate. See apps/cli/README.md#risk.
#   low:          docs, tests and tracker files.
#   medium:       everything else: product code, docs that state no rule,
#                 agent skills, check scripts, lint config and workflows.
#                 Auto-merge takes low and medium at the step medium. Agent
#                 review leaves a PR that weakens a check for the owner.
#   one-way-door: the hard core below. Brendan reviews it: tools/codeowners.ts
#                 writes the path rules to .github/CODEOWNERS, and the main
#                 ruleset requires a code owner's approval.
# Brendan, 2026-11-02: start at 80% of PRs merging with no human, and tighten
# a path only on evidence. See docs/contributing/decisions/0002-merge-most-prs-with-no-human.md.
# Brendan, 2026-11-06: proof gates code, and the owner gates the product. A
# held path leaves the owner when its journeys exist and pass (CL-441). See
# docs/principles/proof-gates-code.md.
schemaVersion: 1
unmatched: medium
rules:
  - tier: one-way-door
    paths:
      # The merge gate: the rulesets, who approves, the tiers, the auto-merge
      # script and workflow, and agent review, its rules and the code that
      # computes a tier.
      - .github/rulesets/**
      - .github/CODEOWNERS
      - .clutch/risk.yaml
      - tools/guardrail-files.json
      - tools/codeowners.ts
      # Each auto-merge file that decides or makes a merge. Its tests and the
      # fake are not held. Name a new auto-merge source file here.
      - tools/github/auto-merge.ts
      - tools/github/auto-merge-brake.ts
      - tools/github/auto-merge-checks.ts
      - tools/github/auto-merge-enable.ts
      - tools/github/auto-merge-rules.ts
      - tools/github/bot-rule.ts
      - .github/workflows/auto-merge.yml
      - .github/workflows/agent-review.yml
      - docs/contributing/review.md
      - apps/cli/src/risk/tiers.ts
      - apps/cli/src/risk-command.ts
      # Credentials: secret scanning, and the MCP servers that run with an
      # agent's credentials. See docs/contributing/setup/agent-tools.md.
      - .gitleaks.toml
      - .gitleaksignore
      - .mcp.json
      - .cursor/mcp.json
      # Auth and access: who an actor is and what it may see.
      - '**/auth/**'
      - packages/access/**
      - packages/identity/**
      # Migrations, the paths tools/check-migrations.ts matches. A deployed
      # migration can lose data.
      - '{apps,features,packages}/**/migrations/**'
      # Decision records and policy docs. They state the rules that agents and
      # reviews follow. #132 merged decision record 0001 as low risk, with no
      # review.
      - docs/contributing/decisions/**
      - docs/principles/**
      - docs/contributing/project-intent.md
      - .clutch/PLAN.md
  - tier: one-way-door
    # Credentials and permissions in a workflow: its token permissions, an
    # environment, a secret, an app token's permissions, or a trigger that runs
    # with this repository's secrets. Any other workflow change is medium.
    paths:
      - .github/workflows/**
    lines:
      - '^\s*permissions:'
      - '^\s*(actions|attestations|checks|contents|deployments|discussions|id-token|issues|packages|pages|pull-requests|repository-projects|security-events|statuses|models):\s*(read|write|none)\b'
      - '^\s*environment:'
      - '\bsecrets\.'
      - '^\s*permission-[a-z-]+:'
      - '^\s*(pull_request_target|workflow_run):'
  - tier: one-way-door
    # The automerge and agentReview sections of clutch.yaml. The rest of the
    # file, such as capabilities, is medium.
    paths:
      - clutch.yaml
    lines:
      - '^automerge:'
      - '^agentReview:'
      - '^\s+(step|owner|missingCredential):'
      - '^\s+mode:\s*(on|off|dry-run)\b'
  - tier: one-way-door
    # Billing: the project's payment and billing code. Empty in the template.
    # Kickoff names it. See docs/contributing/setup/checks.md#ci.
    paths: []
  - tier: one-way-door
    # Infra, deploy and secrets: the project's deploy config, infrastructure
    # code and secret handling. Empty in the template. Kickoff names it. See
    # docs/contributing/setup/checks.md#ci.
    paths: []
  - tier: low
    paths:
      - docs/**
      - '**/*.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - .changeset/*.md
      - .clutch/issues/**
      - .clutch/TRACKER.md
