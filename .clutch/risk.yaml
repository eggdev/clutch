# Risk tiers by path. `clutch risk` gives each changed file the highest tier
# whose globs match it, and a change the highest tier of its files. A file that
# no rule matches gets `unmatched`. A file that matches a rule's `except`
# does not match that rule. Auto-merge reads the tier, so this file is a
# guardrail file. See apps/cli/README.md#risk.
#   low:          docs, tests and tracker files. Auto-merge may take it.
#   medium:       product code and the lockfile. Agent review reads it.
#   high:         any path that no rule names.
#   one-way-door: the automation and its gates, agent steering, auth,
#                 migrations, billing, and infra and secrets. A person reviews it:
#                 tools/codeowners.ts writes these paths to .github/CODEOWNERS,
#                 and the main ruleset requires a code owner's approval.
# The tiers follow Brendan's rule and the published risk policies that
# .clutch/PLAN.md#decisions cites.
schemaVersion: 1
unmatched: high
rules:
  - tier: one-way-door
    # The automation and its gates. Every pattern in the guardrail list counts,
    # so the two cannot drift. The list holds this file.
    guardrails: tools/guardrail-files.json
    paths:
      # The main ruleset as applied on GitHub.
      - .github/rulesets/**
      # Agent steering. Every agent reads these.
      - AGENTS.md
      - CLAUDE.md
      - '**/AGENTS.md'
      - .agents/skills/**
      - .claude/skills/**
      # The MCP servers that agents get. See docs/contributing/setup/agent-tools.md.
      - .mcp.json
      - .cursor/mcp.json
      # Auth: who an actor is and what it may see.
      - '**/auth/**'
      - packages/access/**
      - packages/identity/**
      # Migrations, the paths tools/check-migrations.ts matches. A deployed
      # migration can lose data.
      - '{apps,features,packages}/**/migrations/**'
  - tier: one-way-door
    # Billing: the project's payment and billing code. Empty in the template.
    # Kickoff names it. See docs/contributing/setup/checks.md#ci.
    paths: []
  - tier: one-way-door
    # Infra, deploy and secrets: the project's deploy config, infrastructure
    # code and secret handling. Empty in the template. Kickoff names it. See
    # docs/contributing/setup/checks.md#ci.
    paths: []
  - tier: medium
    paths:
      # A lockfile change alone can pull in new code. CL-405's bot rule merges
      # a Renovate PR that changes only versions, lockfiles and changesets.
      - bun.lock
  - tier: medium
    paths:
      - apps/**
      - features/**
      - packages/**
      - tools/**
    # Docs and tests in these folders stay low.
    except:
      - '**/*.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
  - tier: low
    paths:
      - docs/**
      - '**/*.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - .changeset/*.md
      - .clutch/issues/**
      - .clutch/TRACKER.md
