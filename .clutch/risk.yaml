# Risk tiers by path. `clutch risk` gives each changed file the highest tier
# whose globs match it, and a change the highest tier of its files. A file that
# no rule matches gets `unmatched`. A file that matches a rule's `except`
# does not match that rule. Auto-merge reads the tier, so this file is a
# guardrail file. See apps/cli/README.md#risk.
#   low:          docs, tests and tracker files. Auto-merge may take it.
#   medium:       code, auth, agent steering and the lockfile. Agent review reads it.
#   high:         migrations, and any path that no rule names.
#   one-way-door: what runs or gates the factory, and billing. A person reviews it.
# Brendan's rule (2026-10-30, .clutch/PLAN.md#decisions): trust the agents,
# except for the automation itself and anything that changes billing.
schemaVersion: 1
unmatched: high
rules:
  - tier: one-way-door
    # Automation-critical: each file that runs or gates the factory. A change
    # here can weaken the gate that auto-merge relies on. Every pattern in the
    # guardrail list counts, so the two cannot drift. The list holds this file.
    guardrails: tools/guardrail-files.json
    paths:
      # The main ruleset as applied on GitHub.
      - .github/rulesets/**
  - tier: one-way-door
    # Billing: the project's payment and billing code. Empty in the template.
    # Kickoff names it. See docs/contributing/setup/checks.md#ci.
    paths: []
  - tier: high
    paths:
      # Migrations, the paths tools/check-migrations.ts matches. A deployed
      # migration in a project can lose data.
      - '{apps,features,packages}/**/migrations/**'
  - tier: medium
    paths:
      # Agent steering. Agent review reads each change, and its docs stay medium.
      - AGENTS.md
      - CLAUDE.md
      - '**/AGENTS.md'
      - .agents/skills/**
      - .claude/skills/**
      # A lockfile change alone can pull in new code.
      - bun.lock
  - tier: medium
    paths:
      - apps/**
      - features/**
      - packages/**
      - tools/**
    # Docs and tests in these folders stay low.
    except:
      - '**/*.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
  - tier: low
    paths:
      - docs/**
      - '**/*.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - .changeset/*.md
      - .clutch/issues/**
      - .clutch/TRACKER.md
