# Risk tiers by path. `clutch risk` gives each changed file the highest tier
# whose globs match it, and a change the highest tier of its files. A file that
# no rule matches gets `unmatched`. A file that matches a rule's `except`
# does not match that rule. A rule with `lines` matches a file only when one of
# its added or removed lines matches. Auto-merge reads the tier, so this file
# is part of the merge gate. See apps/cli/README.md#risk.
#   low:          docs, tests and tracker files.
#   medium:       everything else: product code, the code and rules of the
#                 merge gate, decision records and policy docs, agent skills,
#                 check scripts, lint config and workflows. Auto-merge takes
#                 low and medium at the step medium. Agent review leaves a PR
#                 that weakens a check for the owner.
#   one-way-door: a change that cannot be paid back later: a credential, who an
#                 actor is and what it may see, a migration, and a workflow
#                 line that gives a grant. Brendan reviews the paths through
#                 .github/CODEOWNERS, which tools/codeowners.ts writes, and the
#                 main ruleset requires a code owner's approval. The merge
#                 judge holds the workflow lines. It also holds a major change
#                 and a contract break for the owner, whatever the tier. See
#                 tools/github/auto-merge-rules.ts.
# Brendan, 2026-11-02: start at 80% of PRs merging with no human, and tighten
# a path only on evidence. See docs/contributing/decisions/0002-merge-most-prs-with-no-human.md.
# Brendan, 2026-11-06: proof gates code, and the owner gates the product. A
# held path leaves the owner when its journeys exist and pass (CL-441). See
# docs/principles/proof-gates-code.md.
# Brendan, 2026-11-12: the project asked for him too often, 34 of the last 100
# PRs. He signs off a major change, and pays a problem back after he finds it.
# See docs/contributing/decisions/0005-the-owner-signs-off-what-cannot-be-paid-back.md.
schemaVersion: 1
unmatched: medium
rules:
  - tier: one-way-door
    paths:
      # Credentials: secret scanning, and the MCP servers that run with an
      # agent's credentials. See docs/contributing/setup/agent-tools.md.
      - .gitleaks.toml
      - .gitleaksignore
      - .mcp.json
      - .cursor/mcp.json
      # Auth and access: who an actor is and what it may see.
      - '**/auth/**'
      - packages/access/**
      - packages/identity/**
      # Migrations, the paths tools/check-migrations.ts matches. A deployed
      # migration can lose data.
      - '{apps,features,packages}/**/migrations/**'
  - tier: one-way-door
    # Credentials and grants in a workflow: a write permission, a secret, an
    # environment, or a trigger that runs with this repository's secrets. A
    # line that only reads, such as contents: read, is medium.
    paths:
      - .github/workflows/**
    lines:
      - '^\s*[a-z-]+:\s*write\b'
      - '^\s*permissions:\s*write-all\b'
      - '\bsecrets\.'
      - '^\s*environment:'
      - '^\s*(pull_request_target|workflow_run):'
  - tier: one-way-door
    # Billing: the project's payment and billing code. Empty in the template.
    # Kickoff names it. See docs/contributing/setup/checks.md#ci.
    paths: []
  - tier: one-way-door
    # Infra, deploy and secrets: the project's deploy config, infrastructure
    # code and secret handling. Empty in the template. Kickoff names it. See
    # docs/contributing/setup/checks.md#ci.
    paths: []
  - tier: low
    paths:
      - docs/**
      - '**/*.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - .changeset/*.md
      - .clutch/issues/**
      - .clutch/TRACKER.md
