# The primitives registry: one list of the parts of this system.
#
# Each primitive names the folders it owns (`code`), the pages that explain it
# (`docs`) and, for a service, the vendors that only it imports (`vendors`).
# The import policy (tools/lint/import-policy.mjs) reads the vendor owners,
# the languages and the exceptions from this file. tools/check-primitives.ts
# checks the file. See docs/contributing/architecture/index.md#modules.
#
# This file never records dependencies between primitives. Nx derives them
# from the imports. Run `mise exec -- bun nx graph` to see them.
#
# Fields:
#   groups:     id, name
#   primitives: id, group, name, kind (package | feature | app | tool),
#               summary (one line, at most 120 characters),
#               code (folder roots; the longest matching root owns a file),
#               docs (paths), vendors (a package only: vendor, imports)
#   languages:  shared languages: imports, where, primitives, packagePaths, files
#   invariants: id, summary, docs
#   exceptions: rule, file, imports, reason. See
#               docs/contributing/import-boundaries.md#exceptions.
#
# Kickoff adds the product primitives, and fills `languages` and `invariants`.
#
# Risk levels. A PR names the highest level that applies. See
# .agents/skills/pr-recap/SKILL.md.
#   composes (low):   wires existing primitives together. Their behavior stays.
#   extends (medium): changes the behavior or the interface of a primitive.
#   adds (high):      adds, removes or reshapes a primitive. Update this file
#                     in the same PR.

version: 1

groups:
  - id: repository
    name: Repository
  - id: product
    name: Product

primitives:
  - id: review-runtime
    group: repository
    name: Review runtime
    kind: tool
    summary: Central durable review-session queue, lease fencing and cleanup quarantine.
    code:
      - packages/runtime/
    docs:
      - packages/runtime/README.md
      - docs/contributing/architecture/review-runtime.md

  - id: repository-tools
    group: repository
    name: Repository tools
    kind: tool
    summary: The checks, Git hooks, import policy and test helpers that every project shares.
    code:
      - tools/
    docs:
      - docs/contributing/setup/checks.md
      - docs/contributing/import-boundaries.md

  - id: install-cli
    group: repository
    name: Install CLI
    kind: app
    summary: Installs the template into an existing project and starts the kickoff stages with an agent.
    code:
      - apps/cli/
    docs:
      - apps/cli/README.md

  - id: nx-cache
    group: repository
    name: Nx remote cache
    kind: app
    summary: A Cloudflare Worker that stores Nx task results in R2 for local and CI runs.
    code:
      - apps/nx-cache/
    docs:
      - apps/nx-cache/README.md
      - docs/contributing/setup/nx.md

  - id: sync
    group: product
    name: Sync engine
    kind: package
    summary: The object pool, the local database, the event log and the socket that keep each client in step.
    code:
      - packages/sync/
    docs:
      - docs/contributing/architecture/local-first-sync.md
    vendors:
      - vendor: IndexedDB through idb
        imports: ^idb(?:/|$)
      - vendor: PGlite
        imports: ^(?:@electric-sql/pglite|@effect/sql-pglite)(?:/|$)
      - vendor: Postgres driver
        imports: ^@effect/sql-pg(?:/|$)

  - id: identity
    group: product
    name: Identity
    kind: package
    summary: The actor of each connection, and its organization.
    code:
      - packages/identity/
    docs:
      - docs/contributing/architecture/request-context.md

  - id: notes
    group: product
    name: Notes
    kind: package
    summary: The example package. It shows each section, from types to a Test Layer.
    code:
      - packages/notes/
    docs:
      - docs/contributing/architecture/index.md

  - id: design-system
    group: product
    name: Design system
    kind: package
    summary: The token file and the shared components.
    code:
      - packages/design-system/
    docs:
      - docs/contributing/architecture/styling.md

  - id: notes-feature
    group: product
    name: Notes feature
    kind: feature
    summary: The notes screen and its gate.
    code:
      - features/notes/
    docs:
      - docs/principles/one-gate-per-feature.md

  - id: web
    group: product
    name: Web app
    kind: app
    summary: The Vite app. It loads the object pool before the first paint and starts sync after it.
    code:
      - apps/web/
    docs:
      - docs/principles/fast-first-load.md

  - id: api
    group: product
    name: API
    kind: app
    summary: The Bun server. It runs the sync socket and selects the database driver.
    code:
      - apps/api/
    docs:
      - docs/contributing/architecture/local-first-sync.md

  - id: access
    group: product
    name: Access
    kind: package
    summary: 'Who may see what: spaces, memberships and the sync groups of each actor.'
    code:
      - packages/access/
    docs:
      - packages/access/README.md

languages:
  - imports: ^react(?:-dom)?(?:/|$)
    where: '`ui/`, features, apps and `@repo/design-system`'
    primitives:
      - design-system
    packagePaths:
      - ui/
      - testing/
    files:
      - /apps/web/
      - /features/
  - imports: ^@tanstack/
    where: '`apps/web`'
    files:
      - /apps/web/
  - imports: ^effect(?:/|$)
    where: '`types/`, `config/`, `repo/`, `service/`, `jobs/`, `runtime/`, `testing/`, `.server` files, tests, `packages/sync` and the API'
    primitives:
      - sync
    packagePaths:
      - types/
      - config/
      - repo/
      - service/
      - jobs/
      - runtime/
      - testing/
    files:
      - \.server\.[cm]?[jt]sx?$
      - \.test\.[cm]?[jt]sx?$
      - /apps/api/
  - imports: ^drizzle-orm(?:/|$)
    where: '`repo/`, `service/`, `.server` files and `packages/sync`'
    primitives:
      - sync
    packagePaths:
      - repo/
      - service/
    files:
      - \.server\.[cm]?[jt]sx?$

invariants: []

exceptions: []
